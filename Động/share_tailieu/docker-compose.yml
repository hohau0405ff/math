services:
  # 1. DỊCH VỤ REDIS CACHE (Lưu mã OTP 10 phút, phiên làm việc)
  redis:
    image: redis:7-alpine
    container_name: edushare-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # 2. DỊCH VỤ WEB BACKEND FASTAPI + SQL + GMAIL SMTP
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edushare-fastapi
    restart: unless-stopped
    ports:
      - "5500:5500"
    env_file:
      - .env
    environment:
      - PORT=5500
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/app

volumes:
  redis_data:
