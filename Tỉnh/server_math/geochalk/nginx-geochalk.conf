# ==============================================================================
# CẤU HÌNH NGINX CHO HÌNH HỌC (GEOCHALK) CHẠY VỚI PHP-FPM
# ==============================================================================
# Đặt file này vào: /etc/nginx/sites-available/geochalk.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/geochalk.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    # Thay geochalk.yourdomain.com bằng domain hoặc IP máy chủ của bạn:
    server_name geochalk.yourdomain.com;

    # Thư mục gốc chứa mã nguồn geochalk
    root /var/www/geochalk;
    index geochalk.html index.html api.php;

    # Kích thước upload tối đa cho bản vẽ
    client_max_body_size 50M;

    # ==========================================================================
    # 1. BẬT NÉN GZIP TỐI ƯU TẢI NHANH CHO BẢNG VẼ & GEOGEBRA CORE
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # ==========================================================================
    # 2. BỘ NHỚ ĐỆM (CACHE) CHO CÁC TỆP TĨNH KHÔNG ĐỔI
    # ==========================================================================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm|ggb)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ==========================================================================
    # 3. ĐIỀU HƯỚNG CÁC TRANG CON HÌNH HỌC THÂN THIỆN
    # ==========================================================================
    location = / {
        try_files /geochalk.html =404;
    }
    location = /3d {
        try_files /geochalk-3d.html =404;
    }
    location = /geometry {
        try_files /geochalk-geometry.html =404;
    }
    location = /graphing {
        try_files /geochalk-graphing.html =404;
    }
    location = /cas {
        try_files /geochalk-cas.html =404;
    }

    # ==========================================================================
    # 4. CHUYỂN TOÀN BỘ YÊU CẦU API VỀ PHP (api.php)
    # ==========================================================================
    location ^~ /api/ {
        # Đẩy request sang api.php xử lý
        try_files $uri /api.php?$query_string;
    }

    # ==========================================================================
    # 5. XỬ LÝ CÁC TỆP PHP QUA PHP-FPM (FASTCGI)
    # ==========================================================================
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index api.php;

        # Chọn 1 trong 2 phương thức kết nối PHP-FPM:
        # Cách 1 (Unix Socket - Mặc định trên Ubuntu/Debian):
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # Cách 2 (TCP Port - nếu dùng cổng 9000):
        # fastcgi_pass 127.0.0.1:9000;

        # Cấu hình URL máy chủ EduShare để PHP gọi sang xác thực tài khoản:
        fastcgi_param EDUSHARE_AUTH_URL "http://192.168.1.240:5500/api/login";

        # Headers CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
    }

    # ==========================================================================
    # 6. BẢO MẬT: CHẶN TRUY CẬP TRỰC TIẾP TỆP SQLITE (.db) & TỆP ẨN
    # ==========================================================================
    location ~* \.db$ {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
