# ==============================================================================
# CẤU HÌNH NGINX TỔNG HỢP CHO HỆ SINH THÁI MATH HUB (DÙNG CHUNG 1 DOMAIN / 1 SERVER)
# ==============================================================================
# File: /etc/nginx/sites-available/math_hub.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/math_hub.conf /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#
# Đặc điểm:
# 1. Chạy chung toàn bộ web trên 1 domain / IP duy nhất (Không cần tách subdomain):
#    - /                 -> Cổng Math Hub (index.html)
#    - /smt/             -> Giả lập máy tính Vinacal 680EX
#    - /toan/            -> Hình học 2D/3D & Tài liệu toán THPT
#    - /geochalk/        -> Bảng vẽ GeoChalk 3D/2D/CAS (Đổi tên từ hinhhoc)
#    - /geochalk/api/    -> Backend PHP SQLite lưu bài vẽ (Chạy FastCGI PHP-FPM)
#    - /api/             -> Tự động nhận diện API GeoChalk
#    - /edushare/        -> (Tùy chọn) Reverse Proxy tới EduShare (192.168.1.240:5500)
#
# 2. Không cần Docker cho GeoChalk, chạy thuần Nginx + PHP-FPM hiệu năng cao nhất.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name math.vn-ai.cloud localhost;

    # Thư mục gốc chứa toàn bộ dự án server_math
    root /home/hau/Share/server_math;
    index index.html geochalk.html index.php;

    client_max_body_size 50M;
    charset utf-8;

    # --------------------------------------------------------------------------
    # 1. TỐI ƯU HÓA NÉN GZIP (Tăng tốc tải thư viện GeoChalk & Vinacal)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml application/wasm;

    # --------------------------------------------------------------------------
    # 2. CỔNG CHÍNH VÀ CÁC MODULE WEB TĨNH (MATH HUB, SMT, TOAN)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /smt/ {
        try_files $uri $uri/ /smt/index.html;
    }

    location /toan/ {
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # 3. PHÂN HỆ HÌNH HỌC (GEOCHALK) - TRANG GIAO DIỆN & SHORTCUTS
    # --------------------------------------------------------------------------
    location = /geochalk {
        return 301 /geochalk/;
    }

    location = /geochalk/ {
        rewrite ^ /geochalk/geochalk.html last;
    }

    # URL thân thiện cho 4 chế độ vẽ hình GeoChalk:
    location = /geochalk/3d {
        rewrite ^ /geochalk/geochalk-3d.html last;
    }
    location = /geochalk/geometry {
        rewrite ^ /geochalk/geochalk-geometry.html last;
    }
    location = /geochalk/graphing {
        rewrite ^ /geochalk/geochalk-graphing.html last;
    }
    location = /geochalk/cas {
        rewrite ^ /geochalk/geochalk-cas.html last;
    }

    # Cache tài nguyên tĩnh GeoChalk (GeoGebra HTML5 core) trong 30 ngày
    location ~* ^/geochalk/GeoChalk/.*\.(js|css|gif|png|jpg|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. BACKEND API CHO GEOCHALK (PHP-FPM + SQLITE + PROXY LOGIN EDUSHARE)
    # --------------------------------------------------------------------------
    # LỰA CHỌN 1: Proxy trực tiếp Login từ Server 1 (Nginx) sang Server 2 (EduShare 192.168.1.240:5500)
    # Giúp trình duyệt ở cùng domain math.vn-ai.cloud gọi /geochalk/api/auth/login là Nginx lấy ngay từ Server 2:
    location = /geochalk/api/auth/login {
        proxy_pass http://192.168.1.240:5500/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LỰA CHỌN 2: Xử lý các API GeoChalk qua PHP-FPM (Lưu/mở bài vẽ SQLite, và Proxy cURL xác thực)
    # Xử lý khi client gọi /geochalk/api/...
    location ^~ /geochalk/api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/geochalk/api.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param EDUSHARE_AUTH_URL "http://192.168.1.240:5500/api/login";
        # Socket PHP-FPM trên Debian 13 (PHP 8.4)
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    # Xử lý khi client gọi trực tiếp /api/...
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/geochalk/api.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param EDUSHARE_AUTH_URL "http://192.168.1.240:5500/api/login";
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    # Xử lý các file .php thực tế (như /geochalk/api.php?endpoint=...)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param EDUSHARE_AUTH_URL "http://192.168.1.240:5500/api/login";
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    # --------------------------------------------------------------------------
    # 5. REVERSE PROXY ĐẾN EDUSHARE SERVER (IP: 192.168.1.240:5500)
    # --------------------------------------------------------------------------
    # Giúp truy cập thẳng EduShare qua cùng domain tại /edushare/ nếu cần:
    location /edushare/ {
        proxy_pass http://192.168.1.240:5500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 6. BẢO MẬT HỆ THỐNG
    # --------------------------------------------------------------------------
    # Chặn tuyệt đối tải trực tiếp file CSDL SQLite
    location ~* \.db$ {
        deny all;
        return 403;
    }

    # Chặn truy cập các file ẩn, cấu hình git, tài liệu kỹ thuật
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(bat|sh|md|py|sql|log)$ {
        deny all;
        return 404;
    }
}
