# ==============================================================================
# CẤU HÌNH NGINX CHO SERVER WEB ĐỘNG (BACKEND API SERVER)
# ==============================================================================
# Đặt file này vào /etc/nginx/sites-available/math_backend
# và symlink sang /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# Phương án 1: Dùng 2 Subdomain riêng biệt cho 2 API
# ------------------------------------------------------------------------------

# 1. API EduShare (Port 5500)
server {
    listen 80;
    server_name api-edushare.yourdomain.com; # Thay bằng domain của bạn

    client_max_body_size 100M;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chặn tuyệt đối tải trực tiếp file CSDL SQLite, file cấu hình, mã nguồn backend
    location ~* \.(db|sqlite|sqlite3|env|py|yml|yaml|sh|log|git|md|gs)$ {
        deny all;
        return 404;
    }

    # Chặn các tệp và thư mục ẩn
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://192.168.1.240:5500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ CORS nếu cần bổ sung
        add_header 'Access-Control-Allow-Origin' 'https://edushare.vn-ai.cloud' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}

# 2. API GeoChalk / Hình Học (PHP + SQLite)
# Có thể chạy trực tiếp bằng PHP-FPM hoặc Reverse Proxy tới PHP built-in server (Port 8080)
server {
    listen 80;
    server_name api-geochalk.yourdomain.com; # Thay bằng domain của bạn

    root /var/www/geochalk;
    index api.php geochalk.html;
    client_max_body_size 50M;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chặn truy cập file CSDL SQLite và file mã nguồn, cấu hình trực tiếp
    location ~* \.(db|sqlite|sqlite3|env|py|yml|yaml|sh|log|git|md|gs)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Xử lý API qua FastCGI PHP-FPM trực tiếp (Hiệu năng cao nhất, không cần Docker)
    location / {
        try_files $uri $uri/ /api.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Hoặc php8.1, php7.4 tùy phiên bản server
        fastcgi_param EDUSHARE_AUTH_URL "http://192.168.1.240:5500/api/login";
    }
}

# Sau khi cấu hình xong, chạy lệnh sau để cấp chứng chỉ bảo mật SSL miễn phí:
# sudo certbot --nginx -d api-edushare.yourdomain.com -d api-geochalk.yourdomain.com
